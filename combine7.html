<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 한글 솥단지 - 태블릿 최적화</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body { 
            font-family: 'Jua', 'Malgun Gothic', sans-serif; text-align: center; margin: 0; padding: 0;
            touch-action: none; min-height: 100vh; min-height: 100dvh; overflow-y: auto; overflow-x: hidden; /* 🌟 높이가 부족할 경우 스크롤 허용 */
            background-image: url('bg/bg-combine.png'); background-size: cover; background-position: center;
            background-attachment: fixed; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }

        /* 🌟 세로 모드 경고창 (가로 유도) */
        #landscape-warning { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #5b2c6f; z-index: 999999; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; font-family: 'Jua', sans-serif; }
        #landscape-warning .icon { font-size: 80px; animation: rotatePhone 1.5s infinite ease-in-out; margin-bottom: 20px;}
        #landscape-warning p { font-size: 24px; font-family: 'Malgun Gothic', sans-serif;}
        @keyframes rotatePhone { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }
        @media screen and (orientation: portrait) { #landscape-warning { display: flex !important; } }
        
        #intro-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; background: rgba(0, 0, 0, 0.4); transition: opacity 1s; }
        #start-btn { background-color: #9b59b6; color: white; font-size: clamp(24px, 5vw, 32px); font-weight: bold; padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 0 #71368a; transition: all 0.1s; animation: float 2s infinite ease-in-out; font-family: 'Jua', sans-serif;}
        #start-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #71368a; }
        #witch-greeting { font-size: clamp(28px, 6vw, 40px); font-weight: bold; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.8); margin-bottom: 40px; display: none; font-family: 'Jua', sans-serif;}
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }

        #game-ui { display: none; flex-direction: column; width: 100%; min-height: 100%; padding: 5px 10px; opacity: 0; transition: opacity 1.5s; box-sizing: border-box;}

        /* 🌟 반응형 텍스트 및 여백 조절 */
        .header-area { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; margin-bottom: 5px;}
        h1 { color: #fff; font-size: clamp(22px, 4vw, 32px); margin: 5px 0 5px 0; text-shadow: 0 4px 10px rgba(0,0,0,0.3); font-family: 'Jua', sans-serif; }
        .guide { font-size: clamp(14px, 2.5vw, 18px); color: #fff; margin-bottom: 5px; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.5); font-family: 'Malgun Gothic', sans-serif; }

        #mission-banner { display: none; background: rgba(106, 27, 154, 0.85); color: #fff; font-size: clamp(16px, 3vw, 22px); font-family: 'Jua', sans-serif; padding: 5px 20px; border-radius: 30px; border: 3px dashed #e1bee7; margin: 0 auto 5px auto; box-shadow: 0 5px 15px rgba(0,0,0,0.4); animation: float 3s infinite ease-in-out; }
        .mission-char { color: #ffeb3b; font-size: clamp(24px, 4.5vw, 32px); text-shadow: 0 2px 5px rgba(0,0,0,0.5); margin: 0 5px; }

        .action-btn-top { position: absolute; top: 5px; left: 10px; background: #ff6b6b; color: white; text-decoration: none; padding: 5px 10px; border-radius: 20px; font-size: clamp(12px, 2vw, 16px); font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 9999; border: 2px solid white; font-family: 'Jua', sans-serif;}

        /* 🌟 글자 선택 영역 극단적 압축 */
        #selection-board { display: flex; justify-content: space-between; width: 100%; max-width: 900px; margin: 0 auto 5px auto; gap: clamp(5px, 1.5vw, 10px); flex-shrink: 0; }
        .panel { flex: 1; background: rgba(255, 255, 255, 0.85); border-radius: 12px; padding: clamp(5px, 1vw, 10px); box-shadow: 0 5px 10px rgba(0,0,0,0.15); backdrop-filter: blur(5px); }
        .panel h2 { font-size: clamp(14px, 2.5vw, 18px); margin: 0 0 5px 0; border-bottom: 2px solid #eee; padding-bottom: 3px; font-family: 'Jua', sans-serif;}
        
        .grid-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(3px, 0.5vw, 5px); }
        .letter-btn { background-color: #f8f9fa; border: 2px solid #ddd; border-radius: 8px; font-size: clamp(14px, 2.5vw, 18px); font-weight: bold; padding: clamp(4px, 1vw, 8px) 0; cursor: pointer; transition: all 0.1s; color: #333; font-family: 'Malgun Gothic', sans-serif;}
        .letter-btn:active { transform: translateY(3px); box-shadow: 0 0px 0 transparent !important; }

        .cho-btn { background-color: #e6e6fa; border-color: #d8bfd8; box-shadow: 0 3px 0 #d8bfd8; } 
        .jung-btn { background-color: #ffffe0; border-color: #eee8aa; box-shadow: 0 3px 0 #eee8aa; }   
        .jong-btn { background-color: #e0ffff; border-color: #afeeee; box-shadow: 0 3px 0 #afeeee; }
        .empty-jong-btn { background-color: #f5f5f5; border-color: #ccc; grid-column: span 4; color: #888; font-size: clamp(12px, 2vw, 15px); box-shadow: 0 3px 0 #ccc; }

        /* 🌟 솥단지 영역 크기 조절 */
        #cauldron-area {
            background: rgba(255, 255, 255, 0.9); width: 100%; max-width: 700px; margin: 0 auto; padding: 10px;
            border-radius: 15px; border: 4px dashed #ffb6c1; box-shadow: 0 10px 20px rgba(0,0,0,0.2); backdrop-filter: blur(5px);
            position: relative; flex: 1; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box;
        }

        .slots { display: flex; justify-content: center; align-items: center; font-size: clamp(24px, 5vw, 40px); font-weight: bold; gap: clamp(10px, 2vw, 15px); margin-bottom: 10px; color: #555; width: 100%; }
        .slot-box { width: clamp(45px, 10vw, 70px); height: clamp(45px, 10vw, 70px); border: 3px solid #eee; border-radius: 10px; display: flex; justify-content: center; align-items: center; background: #fafafa; transition: all 0.2s; font-size: clamp(22px, 4.5vw, 36px); font-family: 'Malgun Gothic', sans-serif;}
        .highlight { border-color: #ff4500 !important; background-color: #ffe4e1 !important; transform: scale(1.15); box-shadow: 0 0 15px rgba(255, 69, 0, 0.4); color: #ff4500; }

        #mix-gif { display: none; width: clamp(100px, 25vh, 200px); height: auto; margin: 0 auto 5px auto; border-radius: 15px; box-shadow: 0 10px 20px rgba(142, 68, 173, 0.5); animation: popInVideo 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popInVideo { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

        .action-btn { padding: clamp(8px, 2vw, 12px) clamp(15px, 4vw, 30px); font-size: clamp(16px, 3.5vw, 22px); font-family: 'Jua', sans-serif; color: white; border: none; border-radius: 30px; cursor: pointer; transition: all 0.1s; margin: 0 5px; flex-shrink: 0;}
        .action-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 transparent !important; }
        #combine-btn { background-color: #ff69b4; box-shadow: 0 6px 0 #c71585; }
        #reset-btn { background-color: #20b2aa; box-shadow: 0 6px 0 #008080; display: none; }

        #result-text { font-size: clamp(50px, 12vw, 90px); font-weight: 900; margin-top: 5px; display: none; cursor: pointer; transition: transform 0.1s; user-select: none; animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-family: 'Malgun Gothic', sans-serif; }
        #result-text:active { transform: scale(0.9) !important; }
        #replay-hint { font-size: clamp(12px, 2.5vw, 16px); font-weight: bold; color: #888; margin-top: 5px; display: none; animation: fadeIn 1s; font-family: 'Malgun Gothic', sans-serif;}

        @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="landscape-warning">
        <div class="icon">📱</div>
        <h2>화면을 가로로 눕혀주세요!</h2>
        <p>마법 솥단지는 가로 화면에서 해야 가장 재밌어요.</p>
    </div>

    <div id="intro-screen">
        <div id="witch-greeting">"마녀의 마법 가게에 오신 것을 환영해요!"</div>
        <button id="start-btn">🚪 상점 들어가기</button>
    </div>

    <div id="mode-select-modal" style="z-index: 10001; background: rgba(0,0,0,0.8); display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; justify-content: center; align-items: center; flex-direction: column;">
        <div style="background: #fff; width: 90%; max-width: 500px; padding: 25px; border-radius: 20px; border: 5px solid #9b59b6; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h2 style="font-size: clamp(24px, 5vw, 32px); color: #8e44ad; margin-top: 0; font-family: 'Jua', sans-serif;">🧙‍♀️ 마녀의 특별한 부탁!</h2>
            <p style="font-size: clamp(16px, 3.5vw, 20px); font-weight: bold; color: #333; font-family: 'Malgun Gothic', sans-serif;">아까 헷갈렸던 글자를 다시 만들어볼까요?</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
                <button class="action-btn" style="background-color: #ff9800; box-shadow: 0 4px 0 #e65100; font-size: clamp(14px, 3vw, 18px);" onclick="startMissionMode()">도전할래요! 💪</button>
                <button class="action-btn" style="background-color: #9e9e9e; box-shadow: 0 4px 0 #757575; font-size: clamp(14px, 3vw, 18px);" onclick="startFreeMode()">자유롭게 할래요 🎨</button>
            </div>
        </div>
    </div>

    <div id="game-ui">
        <div class="header-area">
            <a href="index.html" class="action-btn-top">🏠 처음으로</a>
            <h1>✨ 뚝딱뚝딱 한글 솥단지</h1>
            <div class="guide">각각의 소리를 골라 솥단지에 넣고 [합치기]를 눌러보세요!</div>
            <div id="mission-banner"></div>
        </div>

        <div id="selection-board">
            <div class="panel">
                <h2 style="color: #9370db;">자음 (처음 소리)</h2>
                <div class="grid-box" id="cho-container"></div>
            </div>
            <div class="panel">
                <h2 style="color: #ffb6c1;">모음 (가운데 소리)</h2>
                <div class="grid-box" id="jung-container"></div>
            </div>
            <div class="panel">
                <h2 style="color: #20b2aa;">받침 (끝 소리)</h2>
                <div class="grid-box" id="jong-container">
                    <button class="letter-btn empty-jong-btn" onclick="handleLetterClick('jong', '')">받침 없음 ❌</button>
                </div>
            </div>
        </div>

        <div id="cauldron-area">
            <img id="mix-gif" src="source/ef-combine2.gif" alt="마법 솥단지"> 
            <div class="slots" id="slots-view">
                <div class="slot-box" id="slot-cho"></div><span>+</span><div class="slot-box" id="slot-jung"></div><span>+</span><div class="slot-box" id="slot-jong"></div>
            </div>
            <button id="combine-btn" class="action-btn">✨ 마법 합치기! ✨</button>
            <button id="reset-btn" class="action-btn">🔄 다시 만들기</button>
            <div id="result-text"></div>
            <div id="replay-hint">👆 글자를 누르면 다시 들을 수 있어요!</div>
        </div>
    </div>

    <script>
        const CHOSUNG_LIST = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNGSUNG_LIST = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONGSEUNG_LIST = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        const displayCho = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const displayJung = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const displayJong = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        const phonicCho = { 'ㄱ':'그으', 'ㄲ':'끄으', 'ㄴ':'느으', 'ㄷ':'드으', 'ㄸ':'뜨으', 'ㄹ':'르으', 'ㅁ':'므으', 'ㅂ':'브으', 'ㅃ':'쁘으', 'ㅅ':'스으', 'ㅆ':'쓰으', 'ㅇ':'으으', 'ㅈ':'즈으', 'ㅉ':'쯔으', 'ㅊ':'츠으', 'ㅋ':'크으', 'ㅌ':'트으', 'ㅍ':'프으', 'ㅎ':'흐으' };
        const phonicJung = { 'ㅏ':'아아', 'ㅐ':'애애', 'ㅑ':'야아', 'ㅒ':'얘애', 'ㅓ':'어어', 'ㅔ':'에에', 'ㅕ':'여어', 'ㅖ':'예에', 'ㅗ':'오오', 'ㅘ':'와아', 'ㅙ':'왜애', 'ㅚ':'외에', 'ㅛ':'요오', 'ㅜ':'우우', 'ㅝ':'워어', 'ㅞ':'웨에', 'ㅟ':'위이', 'ㅠ':'유우', 'ㅡ':'으으', 'ㅢ':'의이', 'ㅣ':'이이' };
        const phonicJong = { 'ㄱ':'윽', 'ㄲ':'윽', 'ㄴ':'은', 'ㄷ':'읃', 'ㄹ':'을', 'ㅁ':'음', 'ㅂ':'읍', 'ㅅ':'읃', 'ㅆ':'읃', 'ㅇ':'응', 'ㅈ':'읒', 'ㅊ':'읓', 'ㅋ':'읔', 'ㅌ':'읕', 'ㅍ':'읖', 'ㅎ':'읗' };

        let state = { cho: "", jung: "", jong: "" }; let targetVoice = null; let isAnimating = false; 
        let currentMissionCharCandidate = null; let currentMissionChar = null;

        function loadVoices() { const voices = window.speechSynthesis.getVoices(); const koVoices = voices.filter(v => v.lang.includes('ko')); targetVoice = koVoices.find(v => v.name.includes('Google')) || koVoices.find(v => v.name.includes('Natural')) || koVoices[0]; }
        window.speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

        function createGrid(letters, containerId, className, type) {
            const container = document.getElementById(containerId);
            letters.forEach(letter => { const btn = document.createElement('button'); btn.className = `letter-btn ${className}`; btn.innerText = letter; btn.onclick = () => handleLetterClick(type, letter); container.appendChild(btn); });
        }
        createGrid(displayCho, 'cho-container', 'cho-btn', 'cho'); createGrid(displayJung, 'jung-container', 'jung-btn', 'jung'); createGrid(displayJong, 'jong-container', 'jong-btn', 'jong');

        function speak(text, isFinal = false) { window.speechSynthesis.cancel(); const utterThis = new SpeechSynthesisUtterance(text); utterThis.lang = 'ko-KR'; utterThis.rate = isFinal ? 0.85 : 0.6; utterThis.pitch = 1.15; if (targetVoice) utterThis.voice = targetVoice; window.speechSynthesis.speak(utterThis); }

        function checkAndShowMissionModal() {
            let weakWords = JSON.parse(localStorage.getItem('hangeul_weak_words') || '[]');
            if (weakWords.length > 0) {
                let targetWord = weakWords[weakWords.length - 1].target; let chars = targetWord.split('').filter(c => c.charCodeAt(0) >= 0xAC00 && c.charCodeAt(0) <= 0xD7A3);
                if (chars.length > 0) { currentMissionCharCandidate = chars[Math.floor(Math.random() * chars.length)]; document.getElementById('mode-select-modal').style.display = 'flex'; speak("마녀가 특별한 부탁을 했어요. 도전해볼까요?"); return; }
            }
            startFreeMode();
        }

        function startMissionMode() { document.getElementById('mode-select-modal').style.display = 'none'; currentMissionChar = currentMissionCharCandidate; document.getElementById('mission-banner').style.display = 'block'; document.getElementById('mission-banner').innerHTML = `🧙‍♀️ 마녀의 주문: <span class="mission-char">'${currentMissionChar}'</span> 글자를 만들어라!`; document.querySelector('.guide').style.display = 'none'; }
        function startFreeMode() { document.getElementById('mode-select-modal').style.display = 'none'; currentMissionChar = null; document.getElementById('mission-banner').style.display = 'none'; document.querySelector('.guide').style.display = 'block'; }

        function logWeakWord(wordStr) { let weakWords = JSON.parse(localStorage.getItem('hangeul_weak_words') || '[]'); if (!weakWords.some(item => item.target === wordStr)) { weakWords.push({ target: wordStr, traps: [] }); if (weakWords.length > 20) weakWords.shift(); localStorage.setItem('hangeul_weak_words', JSON.stringify(weakWords)); } }

        document.getElementById('start-btn').addEventListener('click', () => {
            const startBtn = document.getElementById('start-btn'); const greeting = document.getElementById('witch-greeting');
            startBtn.style.display = 'none'; greeting.style.display = 'block';
            const introAudio = new Audio('source/os-combine.mp3'); introAudio.play().catch(e => console.log("오디오 재생 실패:", e));
            introAudio.onended = () => { transitionToIntro(); }; setTimeout(() => { if (document.getElementById('intro-screen').style.opacity !== '0') { transitionToIntro(); } }, 4000);
        });

        function transitionToIntro() { const intro = document.getElementById('intro-screen'); intro.style.opacity = '0'; setTimeout(() => { intro.style.display = 'none'; const gameUI = document.getElementById('game-ui'); gameUI.style.display = 'flex'; setTimeout(() => { gameUI.style.opacity = '1'; checkAndShowMissionModal(); }, 50); }, 1000); }

        function handleLetterClick(type, letter) {
            if (isAnimating) return; state[type] = letter; document.getElementById(`slot-${type}`).innerText = letter;
            if(type === 'cho') speak(phonicCho[letter]); else if(type === 'jung') speak(phonicJung[letter]); else if(type === 'jong' && letter !== '') speak(phonicJong[letter]); else if(type === 'jong' && letter === '') speak('없음');
            document.getElementById('result-text').style.display = 'none'; document.getElementById('replay-hint').style.display = 'none'; document.getElementById('reset-btn').style.display = 'none'; document.getElementById('combine-btn').style.display = 'inline-block';
        }

        document.getElementById('combine-btn').addEventListener('click', () => {
            if (!state.cho || !state.jung) return alert("자음과 모음을 모두 골라야 합칠 수 있어요!"); if (isAnimating) return; isAnimating = true;
            const slotCho = document.getElementById('slot-cho'); const slotJung = document.getElementById('slot-jung'); const slotJong = document.getElementById('slot-jong'); const delayTime = 900; 
            slotCho.classList.add('highlight'); speak(phonicCho[state.cho]);
            setTimeout(() => { slotCho.classList.remove('highlight'); slotJung.classList.add('highlight'); speak(phonicJung[state.jung]); setTimeout(() => { slotJung.classList.remove('highlight'); if (state.jong) { slotJong.classList.add('highlight'); speak(phonicJong[state.jong]); setTimeout(() => { slotJong.classList.remove('highlight'); playMixingAnimation(); }, delayTime); } else { playMixingAnimation(); } }, delayTime); }, delayTime);
        });

        function playMixingAnimation() {
            const slotsView = document.getElementById('slots-view'); const mixGif = document.getElementById('mix-gif'); const combineBtn = document.getElementById('combine-btn');
            slotsView.style.display = 'none'; combineBtn.style.display = 'none'; mixGif.src = "source/ef-combine2.gif?" + new Date().getTime(); mixGif.style.display = 'block';
            setTimeout(() => { mixGif.style.display = 'none'; slotsView.style.display = 'flex'; setTimeout(() => { showFinalResult(); }, 400); }, 1500);
        }

        function showFinalResult() {
            const choIndex = CHOSUNG_LIST.indexOf(state.cho); const jungIndex = JUNGSUNG_LIST.indexOf(state.jung); let jongIndex = JONGSEUNG_LIST.indexOf(state.jong); if (jongIndex === -1) jongIndex = 0;
            const finalChar = String.fromCharCode(0xAC00 + (choIndex * 588) + (jungIndex * 28) + jongIndex);
            const resultBox = document.getElementById('result-text'); const replayHint = document.getElementById('replay-hint'); resultBox.innerText = finalChar; resultBox.style.display = 'block'; replayHint.style.display = 'block';

            if (currentMissionChar) {
                if (finalChar === currentMissionChar) { speak("성공! " + finalChar + "를 만들었어요!", true); resultBox.style.color = "#32cd32"; replayHint.innerText = "🎉 대성공! 마녀의 주문을 완료했어요!"; replayHint.style.color = "#32cd32"; saveReward(10, 'game_combine'); let weakWords = JSON.parse(localStorage.getItem('hangeul_weak_words') || '[]'); weakWords = weakWords.filter(w => !w.target.includes(currentMissionChar)); localStorage.setItem('hangeul_weak_words', JSON.stringify(weakWords)); currentMissionChar = null; } 
                else { speak("앗, " + finalChar + "가 만들어졌어요.", true); resultBox.style.color = "#ff4500"; replayHint.innerText = `😅 앗! '${finalChar}'(이)가 되었어요. 다시 '${currentMissionChar}'(을)를 만들어볼까요?`; replayHint.style.color = "#ff4500"; logWeakWord(finalChar); }
            } else { speak(finalChar, true); resultBox.style.color = "#ff4500"; replayHint.innerText = "👆 글자를 누르면 다시 들을 수 있어요!"; replayHint.style.color = "#888"; saveReward(5, 'game_combine'); }
            isAnimating = false; document.getElementById('reset-btn').style.display = 'inline-block';
        }

        document.getElementById('result-text').addEventListener('click', function() { if (this.innerText) speak(this.innerText, true); });

        document.getElementById('reset-btn').addEventListener('click', () => {
            state = { cho: "", jung: "", jong: "" }; document.getElementById('slot-cho').innerText = ""; document.getElementById('slot-jung').innerText = ""; document.getElementById('slot-jong').innerText = ""; document.getElementById('result-text').style.display = 'none'; document.getElementById('replay-hint').style.display = 'none'; document.getElementById('reset-btn').style.display = 'none'; document.getElementById('combine-btn').style.display = 'inline-block';
            if (!currentMissionChar) { startFreeMode(); } speak("새로 만들어볼까요?", true);
        });

        function saveReward(earnedCoins, gameId) { let currentCoins = parseInt(localStorage.getItem('hangeul_park_coins') || '0'); localStorage.setItem('hangeul_park_coins', currentCoins + earnedCoins); let clearedGames = JSON.parse(localStorage.getItem('hangeul_park_cleared') || '{}'); let currentCount = clearedGames[gameId]; if (typeof currentCount !== 'number') currentCount = 0; clearedGames[gameId] = currentCount + 1; localStorage.setItem('hangeul_park_cleared', JSON.stringify(clearedGames)); }
    </script>
</body>
</html>
