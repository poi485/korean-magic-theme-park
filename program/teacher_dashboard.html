<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사용 학습 분석 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body { 
            font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; 
            background: #f4f7f6; color: #333; display: flex; flex-direction: column; min-height: 100vh;
        }

        header { 
            background: #1e3c72; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        h1 { font-family: 'Jua', sans-serif; margin: 0; font-size: 28px; letter-spacing: 1px; color: #FFD700; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .header-controls button { background: #ff6b6b; color: white; border: 2px solid white; padding: 6px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-left: 10px; font-family: 'Jua', sans-serif;}
        .header-controls button:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        .tabs { display: flex; justify-content: center; background: #fff; border-bottom: 2px solid #ddd; padding-top: 10px; }
        .tab-btn { padding: 12px 30px; font-size: 18px; font-weight: bold; border: none; background: none; cursor: pointer; color: #777; border-bottom: 4px solid transparent; transition: 0.3s; font-family: 'Jua', sans-serif;}
        .tab-btn.active { color: #1e3c72; border-bottom-color: #FFD700; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; flex: 1; display: none; width: 100%; box-sizing: border-box;}
        .container.active { display: block; }

        /* 학급 통계 탭 스타일 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-top: 5px solid #29b6f6; }
        .card h3 { font-family: 'Jua', sans-serif; color: #0277bd; margin-top: 0; border-bottom: 1px dashed #b3e5fc; padding-bottom: 10px; font-size: 22px;}
        
        .big-number { font-size: 40px; font-weight: 900; color: #ff9800; text-align: center; margin: 10px 0; font-family: 'Jua', sans-serif;}
        .weak-word-rank { list-style: none; padding: 0; margin: 0; }
        .weak-word-rank li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 16px; font-weight: bold; color: #555;}
        .weak-word-rank li span.word { color: #d32f2f; font-size: 18px;}

        /* 개별 리포트 탭 스타일 */
        .report-layout { display: flex; gap: 20px; align-items: flex-start; }
        .student-list { width: 200px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden; flex-shrink: 0;}
        .student-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; font-weight: bold; text-align: center; transition: 0.2s; color: #555;}
        .student-item:hover { background: #f0f4f8; color: #1e3c72; }
        .student-item.selected { background: #29b6f6; color: white; }

        .report-content { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .report-header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-left: 5px solid #FFD700;}
        .report-header h2 { margin: 0; font-family: 'Jua', sans-serif; color: #1e3c72; font-size: 26px;}
        .btn-reset { background: #ff9800; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        .btn-print { background: #4caf50; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}

        .chart-wrapper { position: relative; height: 250px; width: 100%; display: flex; justify-content: center; }
        
        .ai-feedback-box { grid-column: 1 / -1; background: #fff8e1; border: 2px solid #ffca28; border-radius: 15px; padding: 20px; box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        .ai-feedback-box h3 { color: #f57c00; margin-top: 0; display: flex; align-items: center; gap: 8px; font-family: 'Jua', sans-serif; font-size: 22px;}
        .ai-text { font-size: 16px; line-height: 1.6; color: #4e342e; font-weight: bold; word-break: keep-all;}

        .pattern-tag { display: inline-block; background: #e1bee7; color: #6a1b9a; padding: 4px 10px; border-radius: 15px; font-size: 14px; font-weight: bold; margin: 2px; }
        .empty-msg { text-align: center; color: #999; padding: 30px; grid-column: 1/-1; font-weight: bold; }

        /* 프린트 전용 CSS */
        @media print {
            body { background: white; }
            header, .tabs, .student-list, .no-print { display: none !important; }
            .container { max-width: 100%; margin: 0; padding: 0; }
            .report-layout { display: block; }
            .report-content { display: block; }
            .card { box-shadow: none; border: 1px solid #ddd; margin-bottom: 20px; page-break-inside: avoid;}
            .chart-wrapper { height: 300px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>👩‍🏫 마법의 한글 놀이공원 - 학급 관리</h1>
        <div class="header-controls">
            <span id="class-code-display" style="margin-right: 15px; font-weight: bold; color: #b3e5fc;"></span>
            <button class="no-print" onclick="location.href='index.html'">로비로 나가기</button>
        </div>
    </header>

    <div class="tabs no-print">
        <button class="tab-btn active" onclick="switchTab('class-stats')">📊 학급 전체 현황</button>
        <button class="tab-btn" onclick="switchTab('individual-report')">👩‍🎓 개별 학생 리포트</button>
    </div>

    <!-- 1. 학급 전체 현황 탭 -->
    <div id="class-stats" class="container active">
        <div class="stats-grid">
            <div class="card">
                <h3>💎 우리 반 누적 학습량</h3>
                <p style="text-align: center; color: #777; font-weight: bold; margin-bottom: 5px;">아이들이 모은 총 보석 수</p>
                <div class="big-number" id="class-total-gems">0</div>
                <p style="text-align: center; color: #777; font-weight: bold; margin-bottom: 5px; border-top: 1px solid #eee; padding-top: 10px;">총 게임 성공 횟수</p>
                <div class="big-number" id="class-total-clears" style="color: #4caf50;">0</div>
            </div>

            <div class="card">
                <h3>🚨 취약 낱말 TOP 5</h3>
                <ul class="weak-word-rank" id="class-weak-words">
                    <!-- JS로 채워짐 -->
                </ul>
            </div>

            <div class="card">
                <h3>🎡 게임별 참여도 (흥미 분석)</h3>
                <div class="chart-wrapper">
                    <canvas id="classPieChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 개별 학생 리포트 탭 -->
    <div id="individual-report" class="container">
        <div class="report-layout">
            <!-- 좌측 학생 명단 -->
            <div class="student-list no-print" id="student-list-container">
                <!-- JS로 채워짐 -->
            </div>

            <!-- 우측 리포트 본문 -->
            <div class="report-content" id="report-content-container">
                <div class="empty-msg">👈 왼쪽에서 학생을 선택해주세요.</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDakimsR5994YA2uQnjPEKv8He6hHDdhNs",
            authDomain: "korean-magic-theme-park.firebaseapp.com",
            projectId: "korean-magic-theme-park",
            storageBucket: "korean-magic-theme-park.firebasestorage.app",
            messagingSenderId: "916952311588",
            appId: "1:916952311588:web:7715907c441becb08335b1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const classCode = localStorage.getItem('teacherClassCode');
        if (!classCode) {
            alert("인증 정보가 없습니다. 대문 화면에서 다시 로그인해주세요.");
            location.href = "index.html";
        }
        document.getElementById('class-code-display').innerText = `[${classCode}] 반`;

        const gameNames = { 
            'game_ghost': '유령의 집(읽기)', 'game_detective': '명탐정 돋보기(듣기/어휘)', 
            'game_frog': '징검다리(변별)', 'game_line': '선 긋기(운필력)', 
            'game_sketch': '스케치북(쓰기)', 'game_combine': '솥단지(조합)', 'game_boss': '기차(어휘 확장)' 
        };

        let allStudentsData = [];
        let classPieChartInstance = null;
        let studentRadarChartInstance = null;

        // 탭 전환 로직
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.container').forEach(con => con.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // 파이어베이스에서 학급 전체 학생 데이터 불러오기
        async function fetchClassData() {
            try {
                const querySnapshot = await getDocs(collection(db, "students"));
                allStudentsData = [];
                querySnapshot.forEach((doc) => {
                    if (doc.id.startsWith(classCode + "_")) {
                        const studentName = doc.id.replace(classCode + "_", "");
                        allStudentsData.push({ name: studentName, id: doc.id, ...doc.data() });
                    }
                });

                if (allStudentsData.length === 0) {
                    alert("아직 이 반 코드로 등록된 학생 데이터가 없습니다.");
                } else {
                    renderClassStats();
                    renderStudentList();
                }
            } catch (error) {
                console.error("데이터 로드 에러:", error);
                alert("데이터를 불러오는데 실패했습니다.");
            }
        }

        // 1. 학급 전체 통계 렌더링
        function renderClassStats() {
            let totalGems = 0;
            let totalClears = 0;
            let gameCounts = { 'game_ghost':0, 'game_detective':0, 'game_frog':0, 'game_line':0, 'game_sketch':0, 'game_combine':0, 'game_boss':0 };
            let wordFreq = {};

            allStudentsData.forEach(student => {
                totalGems += (student.coins || 0);
                
                if (student.clearedGames) {
                    for (let key in student.clearedGames) {
                        totalClears += student.clearedGames[key];
                        if (gameCounts[key] !== undefined) gameCounts[key] += student.clearedGames[key];
                    }
                }

                if (student.weakWords) {
                    student.weakWords.forEach(w => {
                        const word = w.target;
                        if (!wordFreq[word]) wordFreq[word] = { count: 0, traps: w.traps || [] };
                        wordFreq[word].count++;
                    });
                }
            });

            document.getElementById('class-total-gems').innerText = totalGems;
            document.getElementById('class-total-clears').innerText = totalClears;

            // 취약 낱말 TOP 5
            const sortedWords = Object.keys(wordFreq).sort((a, b) => wordFreq[b].count - wordFreq[a].count).slice(0, 5);
            const weakListEl = document.getElementById('class-weak-words');
            weakListEl.innerHTML = '';
            if (sortedWords.length === 0) {
                weakListEl.innerHTML = '<li style="justify-content:center; color:#999;">데이터가 없습니다.</li>';
            } else {
                sortedWords.forEach((word, idx) => {
                    const traps = wordFreq[word].traps.length > 0 ? `(오답: ${wordFreq[word].traps.join(', ')})` : '';
                    weakListEl.innerHTML += `<li><span>${idx + 1}. <span class="word">${word}</span> <span style="font-size:12px; color:#888;">${traps}</span></span> <span>${wordFreq[word].count}명</span></li>`;
                });
            }

            // 원그래프 (Chart.js)
            const ctx = document.getElementById('classPieChart').getContext('2d');
            if (classPieChartInstance) classPieChartInstance.destroy();
            classPieChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.values(gameNames),
                    datasets: [{
                        data: Object.keys(gameNames).map(k => gameCounts[k]),
                        backgroundColor: ['#ff5252', '#ff4081', '#7c4dff', '#536dfe', '#448aff', '#4caf50', '#ff9800']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });
        }

        // 2. 학생 리스트 사이드바 렌더링
        function renderStudentList() {
            const listContainer = document.getElementById('student-list-container');
            listContainer.innerHTML = '';
            
            // 이름 가나다순 정렬
            allStudentsData.sort((a, b) => a.name.localeCompare(b.name));

            allStudentsData.forEach(student => {
                const div = document.createElement('div');
                div.className = 'student-item';
                div.innerText = student.name;
                div.onclick = () => {
                    document.querySelectorAll('.student-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    renderStudentReport(student);
                };
                listContainer.appendChild(div);
            });
        }

        // 특정 학생 리포트 렌더링 (정성 분석 및 AI 피드백)
        function renderStudentReport(student) {
            const container = document.getElementById('report-content-container');
            
            // 데이터 가공
            let radarData = Object.keys(gameNames).map(k => (student.clearedGames && student.clearedGames[k]) ? student.clearedGames[k] : 0);
            let totalStudentClears = radarData.reduce((sum, val) => sum + val, 0);
            
            // 선호/취약 게임 분석
            let maxGameVal = Math.max(...radarData);
            let bestGameNames = Object.keys(gameNames).filter((k, i) => radarData[i] === maxGameVal && maxGameVal > 0).map(k => gameNames[k]);
            
            // 오답 패턴 분석 로직
            let patterns = analyzePatterns(student.weakWords || []);
            let patternHTML = patterns.length > 0 ? patterns.map(p => `<span class="pattern-tag">${p}</span>`).join('') : '<span style="color:#999;">충분한 데이터가 없습니다.</span>';
            
            // AI 맞춤형 피드백 생성 (활동 0회 예외 처리 반영)
            let aiFeedback = generateAIFeedback(student.name, bestGameNames, patterns, student.coins || 0, totalStudentClears);

            container.innerHTML = `
                <div class="report-header">
                    <h2>👧 ${student.name} 학생 분석 리포트</h2>
                    <div class="no-print">
                        <button class="btn-reset" onclick="resetStudentPassword('${student.id}', '${student.name}')">비밀그림 초기화</button>
                        <button class="btn-print" onclick="window.print()">🖨️ 인쇄하기</button>
                    </div>
                </div>

                <div class="card">
                    <h3>🎯 영역별 성취도 (레이더 차트)</h3>
                    <div class="chart-wrapper">
                        <canvas id="studentRadarChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <h3>🧐 오답 노트 및 패턴 분석</h3>
                    <p style="font-weight:bold; color:#555; margin-bottom:5px;">주요 혼동 패턴:</p>
                    <div style="margin-bottom:15px;">${patternHTML}</div>
                    <p style="font-weight:bold; color:#555; margin-bottom:5px;">최근 틀린 낱말:</p>
                    <div style="display:flex; flex-wrap:wrap; gap:5px;">
                        ${(student.weakWords || []).slice(-10).reverse().map(w => `<span style="border:1px solid #ffcc80; padding:2px 8px; border-radius:10px; font-size:14px;">${w.target}</span>`).join('') || '<span style="color:#999; font-size:14px;">오답 기록이 없습니다.</span>'}
                    </div>
                </div>

                <div class="ai-feedback-box">
                    <h3>🤖 AI 맞춤형 피드백 (생기부/상담용)</h3>
                    <div class="ai-text">${aiFeedback}</div>
                </div>
            `;

            // 레이더 차트 그리기
            const ctx = document.getElementById('studentRadarChart').getContext('2d');
            if (studentRadarChartInstance) studentRadarChartInstance.destroy();
            studentRadarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['읽기(유령)', '듣기(돋보기)', '변별(징검다리)', '운필력(선긋기)', '쓰기(스케치북)', '조합(솥단지)', '어휘(기차)'],
                    datasets: [{
                        label: '성공 횟수',
                        data: radarData,
                        backgroundColor: 'rgba(41, 182, 246, 0.4)',
                        borderColor: '#0288d1',
                        pointBackgroundColor: '#ff9800',
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { r: { ticks: { stepSize: 1, backdropColor: 'transparent' }, beginAtZero: true } } }
            });
        }

        // 패턴 분석 로직
        function analyzePatterns(weakWords) {
            if (weakWords.length < 3) return [];
            let batchimCount = 0; let doubleVowelCount = 0; let trapsCount = 0;
            const COMPLEX_VOWELS = ['ㅐ','ㅒ','ㅔ','ㅖ','ㅘ','ㅙ','ㅚ','ㅝ','ㅞ','ㅟ','ㅢ'];
            
            weakWords.forEach(w => {
                if(w.traps && w.traps.length > 0) trapsCount++;
                for(let i=0; i<w.target.length; i++) {
                    let charCode = w.target.charCodeAt(i) - 0xAC00;
                    if (charCode > -1 && charCode < 11172) {
                        let jung = Math.floor((charCode % 588) / 28); let jong = charCode % 28;
                        if (jong > 0) batchimCount++;
                        if (COMPLEX_VOWELS.includes(['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'][jung])) doubleVowelCount++;
                    }
                }
            });

            let patterns = [];
            if (batchimCount > weakWords.length * 0.4) patterns.push("받침 글자(ㅇ/ㅁ 등) 혼동");
            if (doubleVowelCount > weakWords.length * 0.3) patterns.push("이중모음(ㅐ/ㅔ/ㅘ 등) 구별 미흡");
            if (trapsCount > weakWords.length * 0.5) patterns.push("시각적 함정(비슷한 글자)에 취약");
            
            return patterns.length > 0 ? patterns : ["특정 패턴보다 전반적인 소리 듣기 훈련 중"];
        }

        // AI 텍스트 조립 로직
        function generateAIFeedback(name, bestGames, patterns, coins, totalClears) {
            // 활동 내역이 아예 없는 학생 예외 처리
            if (coins === 0 && totalClears === 0) {
                return `${name} 학생은 아직 놀이공원 활동을 본격적으로 시작하지 않았습니다. 아이가 에듀테크 환경에 흥미를 느낄 수 있도록, '명탐정 돋보기'나 '별자리 선 긋기' 같은 가벼운 탐색 놀이부터 교사나 학부모님이 함께 참여하며 격려해 주시면 큰 도움이 됩니다.`;
            }

            let feedback = `${name} 학생은 마법의 한글 놀이공원 활동에 즐겁게 참여하며 총 ${coins}개의 보석을 모으는 등 훌륭한 과제 집중력을 보이고 있습니다. `;
            
            if (bestGames.length > 0) {
                feedback += `특히 <b>'${bestGames[0]}'</b> 활동을 가장 선호하며, 해당 영역에서 높은 성취감과 자신감을 나타냅니다. `;
            } else {
                feedback += `아직 다양한 활동을 탐색하는 단계로, 흥미를 끌어올릴 수 있는 격려가 필요합니다. `;
            }

            if (patterns.length > 0 && patterns[0] !== "특정 패턴보다 전반적인 소리 듣기 훈련 중") {
                feedback += `학습 데이터를 분석한 결과, <b>[${patterns.join(', ')}]</b> 부분에서 잦은 오독이나 혼동이 발견됩니다. `;
                if (patterns[0].includes("받침")) {
                    feedback += `가정에서는 받침이 있는 낱말 카드를 활용해 입모양을 보며 천천히 소리 내어 읽어보는 연습을 권장합니다.`;
                } else if (patterns[0].includes("이중모음")) {
                    feedback += `가정에서는 그림책을 읽을 때 '과자', '사과' 등 이중모음이 들어간 단어를 짚어가며 소리의 차이를 알려주시면 큰 도움이 됩니다.`;
                } else {
                    feedback += `글자의 모양을 주의 깊게 살피는 '명탐정 돋보기' 활동을 가정에서도 비슷한 놀이로 연계해 주시면 좋습니다.`;
                }
            } else {
                feedback += `현재 두드러지는 오답 패턴 없이 전반적인 기초 한글 감각을 고르게 다져가는 중입니다. 생활 속에서 간판이나 과자 봉지의 글자를 함께 읽어보는 활동이 도움이 됩니다.`;
            }

            return feedback;
        }

        // 비밀번호 초기화 기능 (클라우드 업데이트)
        window.resetStudentPassword = async function(docId, studentName) {
            if (confirm(`${studentName} 학생의 비밀 그림 암호를 초기화하시겠습니까? (초기화 시 다음 로그인 때 새로 설정하게 됩니다.)`)) {
                try {
                    const studentRef = doc(db, "students", docId);
                    await updateDoc(studentRef, {
                        picturePassword: "" // 빈 문자열로 덮어씌워 초기화
                    });
                    alert(`${studentName} 학생의 비밀번호가 성공적으로 초기화되었습니다.`);
                } catch(e) {
                    console.error(e);
                    alert("초기화 중 오류가 발생했습니다.");
                }
            }
        }

        // 초기 데이터 로드 실행
        fetchClassData();
    </script>
